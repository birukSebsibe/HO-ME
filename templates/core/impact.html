{% extends "base.html" %}

{% block title %}Impact &amp; Stories — {{ site.site_name }}{% endblock %}

{% block content %}
<section class="bg-brand-blueDark py-16 text-white">
  <div class="mx-auto max-w-7xl px-4 sm:px-6" data-aos="fade-up">
    <h1 class="text-4xl font-extrabold sm:text-5xl">Impact &amp; Stories</h1>
    <p class="mt-3 max-w-2xl text-blue-100">News, field stories and testimonies — all safety-reviewed before publishing.</p>
  </div>
</section>

<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6" x-data="{
    q:'', kind:'all', region:'all',
    get items(){ return window.__STORIES__.filter(s =>
      (this.kind==='all'||s.kind===this.kind) &&
      (this.region==='all'||s.region===this.region) &&
      (this.q==='' || (s.title+' '+s.excerpt).toLowerCase().includes(this.q.toLowerCase()))
    );}
  }">
  <script>
    // Server-rendered JSON avoids template/Alpine quoting issues
    window.__STORIES__ = {{ stories_json|safe }};
  </script>

  <div class="flex flex-wrap items-center gap-3" data-aos="fade-up">
    <input x-model="q" type="search" placeholder="Search stories…" class="w-full md:w-72 rounded-xl border border-slate2-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    <div class="flex gap-2">
      <button @click="kind='all'" :class="kind==='all' ? 'bg-brand-blue text-white' : 'bg-white border border-slate2-200'" class="rounded-full px-4 py-1.5 text-sm font-semibold">All</button>
      <button @click="kind='news'" :class="kind==='news' ? 'bg-brand-blue text-white' : 'bg-white border border-slate2-200'" class="rounded-full px-4 py-1.5 text-sm font-semibold">News</button>
      <button @click="kind='story'" :class="kind==='story' ? 'bg-brand-blue text-white' : 'bg-white border border-slate2-200'" class="rounded-full px-4 py-1.5 text-sm font-semibold">Stories</button>
      <button @click="kind='testimony'" :class="kind==='testimony' ? 'bg-brand-blue text-white' : 'bg-white border border-slate2-200'" class="rounded-full px-4 py-1.5 text-sm font-semibold">Testimonies</button>
    </div>
    <select x-model="region" class="rounded-xl border border-slate2-200 bg-white px-4 py-2.5 text-sm">
      <option value="all">All regions</option>
      {% for r in regions %}<option value="{{ r.name }}">{{ r.name }}</option>{% endfor %}
    </select>
  </div>

  <div class="mt-10 grid gap-8 md:grid-cols-2 lg:grid-cols-3">
    <template x-for="s in items" :key="s.slug">
      <a :href="'{% url "impact" %}story/' + s.slug + '/'" class="group rounded-2xl bg-white border border-slate2-200 overflow-hidden shadow-sm hover:shadow-xl transition">
        <template x-if="s.cover"><img :src="s.cover" class="h-44 w-full object-cover" alt=""></template>
        <template x-if="!s.cover"><div class="h-44 w-full bg-gradient-to-br from-brand-blueLight to-brand-blueDark"></div></template>
        <div class="p-5">
          <p class="text-xs font-semibold uppercase tracking-wider text-brand-red" x-text="s.kind"></p>
          <h3 class="mt-2 font-bold text-slate2-900" x-text="s.title"></h3>
          <p class="mt-2 text-sm text-slate2-600 line-clamp-2" x-text="s.excerpt"></p>
        </div>
      </a>
    </template>
  </div>
  <p x-show="items.length===0" class="mt-10 text-center text-brand-blue">No stories match your filters.</p>
</section>
{% endblock %}
