{% extends "base.html" %}

{% block title %}Resource Library — {{ site.site_name }}{% endblock %}

{% block content %}
<section class="bg-brand-blueDark py-16 text-white">
  <div class="mx-auto max-w-7xl px-4 sm:px-6" data-aos="fade-up">
    <h1 class="text-4xl font-extrabold sm:text-5xl">Resource Library</h1>
    <p class="mt-3 max-w-2xl text-blue-100">Training materials, research and tools — filter by category, language or audience.</p>
  </div>
</section>

<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6" x-data="{
    q:'', cat:'all', lang:'all', aud:'all',
    get items(){ return window.__RES__.filter(r =>
      (this.cat==='all'||r.category===this.cat) &&
      (this.lang==='all'||r.language===this.lang) &&
      (this.aud==='all'||r.audiences.includes(this.aud)) &&
      (this.q==='' || (r.title+' '+r.description).toLowerCase().includes(this.q.toLowerCase()))
    );}
  }">
  <script>
    window.__RES__ = {{ resources_json|safe }};
  </script>

  <div class="flex flex-wrap items-center gap-3" data-aos="fade-up">
    <input x-model="q" type="search" placeholder="Search resources…" class="w-full md:w-72 rounded-xl border border-slate2-200 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    <select x-model="cat" class="rounded-xl border border-slate2-200 bg-white px-4 py-2.5 text-sm">
      <option value="all">All categories</option>
      {% for c in categories %}<option value="{{ c.name }}">{{ c.name }}</option>{% endfor %}
    </select>
    <select x-model="lang" class="rounded-xl border border-slate2-200 bg-white px-4 py-2.5 text-sm">
      <option value="all">All languages</option>
      {% for c in categories %}{% endfor %}
      {% for l in languages %}<option value="{{ l.name }}">{{ l.name }}</option>{% endfor %}
    </select>
    <select x-model="aud" class="rounded-xl border border-slate2-200 bg-white px-4 py-2.5 text-sm">
      <option value="all">All audiences</option>
      {% for a in audiences %}<option value="{{ a.name }}">{{ a.name }}</option>{% endfor %}
    </select>
  </div>

  <div class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    <template x-for="r in items" :key="r.slug">
      <div class="flex flex-col rounded-2xl border border-slate2-200 bg-white p-5 shadow-sm hover:shadow-lg transition">
        <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-blue-300">
          <i data-lucide="file-text" class="h-4 w-4"></i><span x-text="r.category"></span>
        </div>
        <h3 class="mt-2 font-bold text-slate2-900" x-text="r.title"></h3>
        <p class="mt-2 text-sm text-slate2-600 line-clamp-2 flex-1" x-text="r.description"></p>
        <p class="mt-3 text-xs text-brand-blue">⬇ <span x-text="r.downloads"></span> downloads</p>
        <template x-if="r.is_public">
          <a :href="'{% url "library" %}' + r.slug + '/download/'" class="mt-4 inline-block rounded-lg bg-brand-blue px-4 py-2 text-center text-sm font-semibold text-white hover:bg-brand-blue">Download</a>
        </template>
        <template x-if="!r.is_public">
          <a :href="'{% url "library" %}' + r.slug + '/request-access/'" class="mt-4 inline-block rounded-lg border border-brand-blueLight px-4 py-2 text-center text-sm font-semibold text-slate2-700 hover:bg-blue-50">Request Access</a>
        </template>
      </div>
    </template>
  </div>
  <p x-show="items.length===0" class="mt-10 text-center text-brand-blue">No resources match your filters.</p>
</section>
{% endblock %}
